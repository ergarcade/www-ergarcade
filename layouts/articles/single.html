{{ define "head-extra" }}
<script src="https://cdn.jsdelivr.net/npm/echarts@{{ .Site.Params.echartsVersion }}/dist/echarts.min.js"
    integrity="{{ .Site.Params.echartsIntegrity }}"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@{{ .Site.Params.echartsVersion }}/theme/dark.js"
    integrity="{{ .Site.Params.echartsDarkIntegrity }}"
    crossorigin="anonymous"></script>
<script type="module" src="{{ .Params.chartScript | absURL }}"></script>
{{ end }}

{{ define "main" }}
<section class="article-hero">
    <h1>{{ .Title }}</h1>
    <p>{{ .Params.tagline }}</p>
</section>

<section class="article-section prose">
{{ .Content }}
</section>
{{ end }}
