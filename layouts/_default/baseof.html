<!doctype html>

<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Erg Arcade!{{ if not .IsHome }} {{ .Title }}{{ end }}</title>

        <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        })();
        </script>

        <script async src="https://www.googletagmanager.com/gtag/js?id=G-H718C7S394"></script>
        <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-H718C7S394');
        </script>

        <link rel="stylesheet" type="text/css" href="{{ "style.css" | absURL }}">

        <link rel="icon" type="image/png" href="{{ "images/ergarcade-64x64.png" | absURL }}">
        <meta name="theme-color" content="#ededed" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">

        {{ block "head-extra" . }}{{ end }}
    </head>

    <body>
        {{ partial "header.html" . }}

        {{ block "main" . }}{{ end }}

        {{ partial "footer.html" . }}

        <script src="{{ "js/theme-toggle.js" | absURL }}" defer></script>
        <script src="{{ "js/nav-toggle.js" | absURL }}" defer></script>
    </body>
</html>
